services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stroysync
      POSTGRES_PASSWORD: stroysync
      POSTGRES_DB: stroysync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroysync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://stroysync:stroysync@db:5432/stroysync
      DETECTOR_BACKEND: demo
      MEDIA_DIR: /app/media
      DATA_DIR: /app/data
    volumes:
      - ./media:/app/media
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
